# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Change prefix key
set-option -g prefix C-a
bind-key C-a send-prefix

# use opt+j/k to move between windows
bind -n M-j previous-window
bind -n M-k next-window
unbind -n C-j
unbind -n C-k

# Map Shift+Enter to send Escape then Enter (recognized as alt+enter by apps)
bind -n S-Enter send-keys Escape Enter


# Scroll with the trackpad/mouse wheel (enters copy mode automatically)
set -g mouse on

# Keep much more scrollback than the default 2000 lines
set -g history-limit 50000

# vi keys in copy mode (Ctrl-u / Ctrl-d half-page, / to search)
setw -g mode-keys vi
